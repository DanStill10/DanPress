name: dan-still-wordpress-site
recipe: wordpress
config:
  webroot: .
  php: '8.0'
  database: mysql

services:
  appserver: 
    type: php:8.0 # Specify the PHP version for the appserver
    build:
      - "test -f wp-includes/version.php || (curl -fsSL https://wordpress.org/latest.tar.gz -o /tmp/wp.tar.gz && tar -xzf /tmp/wp.tar.gz -C /tmp && cp -a /tmp/wordpress/* . && rm -rf /tmp/wordpress /tmp/wp.tar.gz)"
      - "composer install --no-dev --no-interaction --prefer-dist" # Example: run composer install on build
    environment:
      WP_ENV: development
      WP_HOME: http://dan-still-wordpress-site.lndo.site
      WP_SITEURL: http://dan-still-wordpress-site.lndo.site

  mysql:
    type: mysql:8.4
    portforward: true

tooling:
  composer:
    service: appserver
    cmd: composer

  yarn:
    service: appserver
    cmd: yarn

  sass:
    service: appserver
    cmd: sass

  npm:
    service: appserver
    cmd: npm

  build:
    service: appserver
    cmd: yarn build

  dev:
    service: appserver
    cmd: yarn dev

proxy:
  appserver:
    - dan-still-wordpress-site.lndo.site