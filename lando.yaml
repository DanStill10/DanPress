name: dan-still-wordpress-site
recipe: wordpress
config:
  webroot: .
  php: '8.0'  # You can also use 8.1, 8.2, etc.
  database: mysql

services:
  mysql:
    type: mysql:5.7  # or 8.0 if you prefer
    portforward: true

tooling:
  wp:
    service: appserver
    cmd: wp

proxy:
  appserver:
    - dan-still-wordpress-site.lndo.site
